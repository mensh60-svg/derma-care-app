<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديرما كير كلينك</title>
<meta name="theme-color" content="#1F6F6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ديرما كير">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#F6F4F1;color:#1F2A2E;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
#f{position:fixed;inset:0;width:100%;height:100%;border:0}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F6F4F1;z-index:2;transition:opacity .3s}
#splash img{width:96px;height:96px;border-radius:24px}
#splash b{font-size:20px}
#splash span{font-size:14px;color:#5B6668}
#help{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;display:none;background:#1F2A2E;color:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7}
#help a{display:block;margin-top:10px;background:#1F6F6B;color:#fff;text-align:center;text-decoration:none;border-radius:10px;padding:12px;font-weight:bold}
#help button{position:absolute;top:6px;left:8px;width:40px;height:40px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>ديرما كير كلينك</b><span>جاري التحميل...</span></div>
<iframe id="f" title="ديرما كير كلينك" allow="camera; clipboard-write" src="https://script.google.com/macros/s/AKfycbxE55gDOL0qhQbCvAcjEr2Wasf-RFv_oAHsDE6OMebxvuN_YaRzjj2tC2YKLhHoif0N/exec?page=app"></iframe>
<div id="help" role="alert"><button aria-label="إغلاق" onclick="this.parentNode.style.display='none'">×</button>لو الشاشة فاضية أو طالب تسجيل دخول، سجّل دخول بحساب جوجل بتاع العيادة من الزرار ده، وبعدين ارجع هنا واقفل التطبيق وافتحه تاني.<a href="https://script.google.com/macros/s/AKfycbxE55gDOL0qhQbCvAcjEr2Wasf-RFv_oAHsDE6OMebxvuN_YaRzjj2tC2YKLhHoif0N/exec?page=app" target="_blank" rel="noopener">تسجيل الدخول بجوجل</a></div>
<script>
var ready=false;
function hideSplash(){var s=document.getElementById('splash');if(!s)return;s.style.opacity=0;setTimeout(function(){s.remove()},300)}
window.addEventListener('message',function(e){if(e.data==='derma-ready'){ready=true;hideSplash();document.getElementById('help').style.display='none'}});
document.getElementById('f').addEventListener('load',function(){setTimeout(hideSplash,1500)});
setTimeout(function(){if(!ready){hideSplash();document.getElementById('help').style.display='block'}},15000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
